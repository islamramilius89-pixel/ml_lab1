name: CI/CD Pipeline for Penguin API

on:
  push:
    branches: [main, lab2]
  pull_request:
    branches: [main, lab2]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  PROJECT_DIR: ML_LaB3
  POSTGRES_USER: ${{ secrets.DB_USER }}
  POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
  POSTGRES_DB: ${{ secrets.DB_NAME }}
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$PROJECT_DIR/requirements.txt"

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ env.PROJECT_DIR }}
        run: pytest "$PROJECT_DIR/tests/unit/"

  build-and-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/penguin-api
        run: |
          docker build -t "$IMAGE_NAME:${GITHUB_SHA}" -t "$IMAGE_NAME:latest" "$PROJECT_DIR"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

  deploy-and-functional-test:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: |
          cat > "$PROJECT_DIR/.ci.env" <<EOF
          POSTGRES_USER=${POSTGRES_USER:-gha_user}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gha_password}
          POSTGRES_DB=${POSTGRES_DB:-predictions_db}
          DB_CONTAINER_HOST=postgres
          DB_PORT=5432
          APP_PORT=8000
          APP_HOST_PORT=8000
          VAULT_ADDR=http://vault:8200
          VAULT_TOKEN=${VAULT_TOKEN:-root-token}
          VAULT_SECRET_PATH=ml-lab3/db
          VAULT_KV_MOUNT=secret
          EOF

      - name: Start containers
        run: docker compose -f "$PROJECT_DIR/docker-compose.yml" --env-file "$PROJECT_DIR/.ci.env" up --build -d

      - name: Run functional tests
        env:
          PYTHONPATH: ${{ env.PROJECT_DIR }}
          RUN_LIVE_TESTS: "1"
          BASE_URL: http://localhost:8000
        run: |
          pip install -r "$PROJECT_DIR/requirements.txt"
          pytest "$PROJECT_DIR/tests/functional/"

      - name: Stop containers
        if: always()
        run: docker compose -f "$PROJECT_DIR/docker-compose.yml" --env-file "$PROJECT_DIR/.ci.env" down -v --remove-orphans
